name: Build and Test
run-name: Build docker container and test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "*"

jobs:
  build:
    name: pytest (${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install .[dev]
      - name: Validate commits
        if: github.ref != 'refs/heads/main'
        run: |
          source venv/bin/activate
          cz check --rev-range origin/main..
      - name: Test with pytest
        run: |
          source venv/bin/activate
          pytest
  nf-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0
      - name: Build docker container
        run: |
          docker build -t test_container_myco_summary .
      - name: Inspect
        run: |
          docker image inspect test_container_myco_summary

      - name: Run nf-test
        run: nf-test test tests/workflow.nf.test --profile local_docker
