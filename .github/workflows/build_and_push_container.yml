name: Build and Push Container

on:
  push:
    tags:
      - '*.*.*'
      - '*.*.*-rc*'
      - '*.*.*\+*'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  REGISTRY: lhr.ocir.io
  IMAGE_NAME: lrbvkel2wjot/gpas/summary_pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build docker containers"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0

      - name: Determine the tag to use
        id: image-tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_ENV
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to OCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCR_USERNAME }}
          password: ${{ secrets.OCR_TOKEN }}

      - name: Set full image registry tag
        run: |
          echo "FULL_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.tag }}" >> $GITHUB_ENV
          echo "FULL_IMAGE_TAG: ${{ env.FULL_IMAGE_TAG }}"

      - name: Build and push
        id: build_and_push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: Dockerfile
          # Attestation/SBOM manifests wrap the image in an OCI index, which has caused
          # "manifest not found" pull failures when the attestation child is unreachable.
          provenance: false
          sbom: false
          tags: |
            ${{ env.FULL_IMAGE_TAG }}
