name: Manually Build and Push Container

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to check out and build from (tag, branch, or commit hash)'
        required: true
        type: string
      image_tag:
        description: 'Image tag to publish as (optional - defaults to ref)'
        required: false
        type: string

env:
  REGISTRY: lhr.ocir.io
  IMAGE_NAME: lrbvkel2wjot/gpas/summary_pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build docker containers"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.PAT_TOKEN }}"
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Determine the tag to use
        id: image-tag
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "tag=${{ inputs.ref }}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to OCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCR_USERNAME }}
          password: ${{ secrets.OCR_TOKEN }}

      - name: Set full image registry tag
        run: |
          echo "FULL_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.tag }}" >> $GITHUB_ENV
          echo "FULL_IMAGE_TAG: ${{ env.FULL_IMAGE_TAG }}"

      - name: Build and push
        id: build_and_push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: Dockerfile
          provenance: false
          sbom: false
          tags: |
            ${{ env.FULL_IMAGE_TAG }}